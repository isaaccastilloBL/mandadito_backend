function add(sid,pid){let s=stores.find(x=>x.id===sid),raw=s?.products.find(p=>p[0]===pid);if(raw&&(productConfig(raw).allowNote!==false||productConfig(raw).groups.length))return openProductChoices(sid,pid);let p=product(pid,s);if(!p)return;if(db.cart.store&&db.cart.store!==sid&&count()){if(!confirm('Tu carrito tiene productos de otro comercio. ¿Quieres reemplazarlos?'))return;db.cart.items=[]}db.cart.store=sid;let x=db.cart.items.find(i=>i.id===pid);if(x)x.qty++;else db.cart.items.push({...p,qty:1});save();render();toast(`${p.name} agregado al carrito`)}function quantity(id,delta){let i=db.cart.items.find(x=>(x.lineKey||x.id)===id);if(!i)return;if(i.qty+delta>30)return toast('Máximo 30 unidades por preparación');i.qty+=delta;if(i.qty<=0)db.cart.items=db.cart.items.filter(x=>(x.lineKey||x.id)!==id);if(!db.cart.items.length)db.cart.store=null;save();render()}function clearCart(){if(!confirm('¿Vaciar el carrito?'))return;db.cart={store:null,items:[]};save();render()}function unavailableCommerceCart(){return `<div class="card empty"><h2>Este comercio no está disponible</h2><p class="muted">Tu carrito sigue guardado, pero no se puede solicitar este pedido. Puedes explorar otros negocios o vaciarlo.</p><button class="btn" onclick="setCat('Todos')">Explorar comercios</button><button class="link" onclick="clearCart()">Vaciar carrito</button></div>`}
function cart(){let s=stores.find(x=>x.id===db.cart.store);if(count()&&!s)return unavailableCommerceCart();return `<h1 class="page-title">Tu carrito</h1>${count()?`<p class="sub">Pedido de ${esc(s.name)} · ${count()} producto(s)</p><div class="layout"><div class="card"><h2>Productos</h2>${db.cart.items.map(i=>`<div class="product"><div class="product-emoji"><img src="${i.image||''}" alt="Fotografía ilustrativa de ${esc(i.name)}" loading="lazy" onerror="this.style.display='none'"><span>${i.icon}</span></div><div class="product-details"><h3>${esc(i.name)}</h3>${itemDetailsHtml(i)}<span>${fmt(i.price)}</span><button class="link item-edit" onclick="editCartProduct('${i.lineKey||i.id}')">Editar</button></div><div class="qty"><button onclick="quantity('${i.lineKey||i.id}',-1)">−</button>${i.qty}<button onclick="quantity('${i.lineKey||i.id}',1)">+</button></div></div>`).join('')}<button class="link" onclick="openStore('${s.id}')">+ Agregar más productos</button></div><aside class="card">${cartSummary()}</aside></div>`:empty('🛒','Tu carrito está vacío','Encuentra algo rico y agrégalo aquí.','Explorar comercios',"setCat('Todos')")}`}
async function requestDeliveryQuote(force=false){if(!stores.some(s=>s.id===db.cart.store)||!serverMode||!sessionToken||page!=='checkout'||!db.addresses[checkout.address]||!count())return;let storeId=db.cart.store,address=db.addresses[checkout.address],key=storeId+':'+address.id+':'+address.lat+':'+address.lng+':'+checkout.coupon+':'+JSON.stringify(cartItemsForApi());if(!force&&(quoteLoading||quote?.key===key||quoteError))return;let sequence=++quoteSequence;quoteLoading=true;quoteError='';quote=null;try{let r=await apiReq('/delivery/quote','POST',{storeId,addressId:address.id,coupon:checkout.coupon,items:cartItemsForApi()});if(sequence!==quoteSequence||db.cart.store!==storeId||db.addresses[checkout.address]?.id!==address.id)return;quote={...r,key};if(r.items?.length===db.cart.items.length){db.cart.items=db.cart.items.map((line,i)=>({...line,...r.items[i]}));save()}}catch(e){if(sequence===quoteSequence)quoteError=e.message}finally{if(sequence===quoteSequence){quoteLoading=false;if(page==='checkout')render()}}}
function checkoutView(){if(count()&&!stores.some(s=>s.id===db.cart.store))return unavailableCommerceCart();if(!count())return empty('🛒','No hay productos','','Explorar',"setCat('Todos')");let s=stores.find(x=>x.id===db.cart.store),discount=serverMode?(quote?.promotion?.discount||0):0,total=quote?subtotal()+quote.fee-discount:null;return `<h1 class="page-title">Finaliza tu pedido</h1><p class="sub">${esc(s.name)} · Entrega a domicilio</p><div class="layout"><div class="stack"><div class="card"><h2>📍 Dirección de entrega</h2>${db.addresses.length?db.addresses.map((a,i)=>`<label class="choice ${checkout.address===i?'selected':''}"><input type="radio" name="address" ${checkout.address===i?'checked':''} onchange="checkout.address=${i};quote=null;requestDeliveryQuote(true);render()"><span><b>${esc(a.label)}</b><br><span class="mini">${esc(a.street)}, ${esc(a.area)}, Zumpango</span><br><span class="mini">${Number.isFinite(a.lat)&&Number.isFinite(a.lng)?'📍 Pin confirmado':'⚠️ Sin ubicación en mapa'}</span></span></label>`).join(''):'<p class="muted">Agrega una dirección antes de continuar.</p>'}<button class="link" onclick="showModal('address')">+ Agregar dirección</button></div><div class="card" style="margin-top:15px"><h2>💳 Forma de pago</h2><label class="choice selected"><input type="radio" checked> Efectivo al recibir</label><div class="notice">Paga en efectivo al recibir tu pedido. Revisa el total antes de confirmar.</div></div><div class="card" style="margin-top:15px"><h2>Detalles de la entrega</h2><div class="field"><label>Instrucciones para el repartidor</label><textarea id="note" oninput="checkout.note=this.value" rows="3" maxlength="180" placeholder="Ej. tocar el timbre">${esc(checkout.note)}</textarea></div></div></div><aside class="card cart-side"><h2>Resumen</h2>${db.cart.items.map(i=>`<div class="row" style="margin:9px 0"><span>${i.qty} × ${esc(i.name)}${itemDetailsHtml(i)}</span><b>${fmt(i.qty*i.price)}</b></div>`).join('')}<hr class="divider"><div class="row"><span>Subtotal</span><b>${fmt(subtotal())}</b></div><div class="row" style="margin-top:8px"><span>Envío</span><b>${quote?fmt(quote.fee):'Por calcular'}</b></div>${quote?`<p class="mini">${fmt(quote.startingFee||0)} base + ${quote.distanceKm.toFixed(3)} km × ${fmt(quote.pricePerKm)} / km${quote.rainFee?` + ${fmt(quote.rainFee)} por lluvia`:''}<br>${quote.origin.demo?'Punto del comercio  · ':''}Distancia por calles · ${quote.durationMinutes} min estimados</p>`:''}${quoteError?`<p class="accent">${esc(quoteError)}</p><button class="link" onclick="requestDeliveryQuote(true)">Reintentar cotización</button>`:''}${discount?`<div class="row accent" style="margin-top:8px"><span>Descuento</span><b>−${fmt(discount)}</b></div>`:''}<div class="field"><label for="coupon">Cupón o código de un amigo</label><div class="row"><input id="coupon" placeholder="Escribe tu código" maxlength="40" autocomplete="off" autocapitalize="characters" value="${esc(checkout.coupon)}"><button class="btn light" onclick="applyCoupon()">Aplicar</button></div>${checkout.coupon?'<button class="link" onclick="removeCoupon()">Quitar código</button>':''}${quote?.promotion?.code?`<p class="small accent" role="status">${esc(quote.promotion.label)}</p>`:''}</div><hr class="divider"><div class="row"><h3>Total</h3><h3>${total===null?'Por calcular':fmt(total)}</h3></div><button class="btn full" ${!quote||quoteLoading?'disabled':''} onclick="placeOrder()">Confirmar pedido</button><p class="small muted">El comercio y los repartidores recibirán tu solicitud.</p></aside></div>`}
async function applyCoupon(){if(!serverMode)return toast('Abre la app desde el servidor para usar códigos');let code=$('#coupon').value.trim().toUpperCase();if(code.length>40)return toast('Código demasiado largo');checkout.coupon=code;quote=null;quoteError='';await requestDeliveryQuote(true);if(quote)toast(code?(quote.promotion?.kind==='referral'?'Invitación registrada':'Cupón aplicado'):'Código quitado','✓')}function removeCoupon(){checkout.coupon='';quote=null;quoteError='';requestDeliveryQuote(true);render()}function placeOrder(){if(!db.addresses.length)return toast('Agrega una dirección de entrega');if(!Number.isFinite(db.addresses[checkout.address]?.lat)||!Number.isFinite(db.addresses[checkout.address]?.lng)){showModal('address',checkout.address);return toast('Marca el pin de entrega antes de pedir')}if(!db.user){showModal('login');return toast('Crea tu cuenta o entra para continuar')}checkout.note=$('#note')?.value.trim()||'';let s=stores.find(x=>x.id===db.cart.store),discount=0,o={id:'MD-'+String(Date.now()).slice(-8),kind:'purchase',store:s.name,items:structuredClone(db.cart.items),address:structuredClone(db.addresses[checkout.address]),deliveryLocation:{lat:db.addresses[checkout.address].lat,lng:db.addresses[checkout.address].lng,accuracy:db.addresses[checkout.address].accuracy??null},note:checkout.note,fee:s.fee,discount,total:subtotal()+s.fee-discount,status:'Recibido · app',created:new Date().toISOString()};db.orders.unshift(o);db.notifications.unshift({id:Date.now(),title:'Pedido creado',body:`Tu pedido ${o.id} está en tu historial.`,read:false});db.cart={store:null,items:[]};checkout={address:0,payment:'Efectivo',note:'',coupon:''};save();currentOrder=o.id;go('orderDetail');toast('¡Pedido creado!')}
function sendView(){return helpPanel()}
function orders(){return `<h1 class="page-title">Mis pedidos</h1><p class="sub">Revisa tu historial y detalles.</p>${db.orders.length?`<div class="order-list">${db.orders.map(o=>`<article class="card"><div class="row"><div><span class="eyebrow">${o.kind==='send'?'ENVÍO':'PEDIDO'} · ${esc(o.id)}</span><h2 style="margin:5px 0">${esc(o.store)}</h2></div><span class="status">${esc(({placed:'Buscando repartidor',assigned:'Repartidor asignado',picked_up:'En camino a tu domicilio',delivered:'Entregado'})[o.status]||o.status)}</span></div><p class="muted">${new Date(o.created).toLocaleString('es-MX')} · ${o.items.map(i=>`${i.qty} ${esc(i.name)}`).join(', ')}</p><div class="row"><b>${fmt(o.total)}</b><button class="btn light" onclick="currentOrder='${o.id}';go('orderDetail')">Ver detalle →</button></div></article>`).join('')}</div>`:empty('🧾','Todavía no hay pedidos','Cuando hagas un pedido, aparecerá aquí.','Explorar',"setCat('Todos')")}`}
function orderDetail(){let o=db.orders.find(x=>x.id===currentOrder);if(!o)return orders();return customerOrderView(o)}
function orderStatus(o){return ({placed:'Preparando tu pedido',assigned:'Preparando tu pedido',picked_up:'Tu pedido va en camino',delivered:'¡Pedido entregado!'})[o.status]||o.status}
function preparationText(o){if(o.status==='cancelled')return 'Pedido cancelado';if(o.status==='delivered')return 'Entrega completada';if(o.status==='picked_up')return o.etaMinutes?`Llegada aproximada: ${o.etaMinutes} min`:'El repartidor va a tu domicilio';if(o.preparation?.ready||o.commerceStatus==='ready')return 'Tu pedido está listo para recoger';if(o.preparation?.pending||(!o.preparation?.readyAt&&o.commerceStatus==='new'))return 'El comercio está por indicar el tiempo de preparación';let remaining=Math.max(0,Math.ceil((Date.parse(o.preparation?.readyAt||o.created)-Date.now())/60000));return remaining?`Preparación aproximada: ${remaining} min${o.preparation?.source==='merchant'?' · indicada por el comercio':''}`:'El tiempo estimado de preparación transcurrió; esperando confirmación del comercio'}
function sheetHandle(){return `<button class="sheet-handle" role="slider" aria-label="Desliza para abrir los detalles del pedido" aria-valuemin="28" aria-valuemax="84" aria-valuenow="${Math.round(sheetHeightVh)}" onpointerdown="beginOrderSheet(event)" onkeydown="keyboardOrderSheet(event)"><span></span></button>`}
function orderCosts(o){let subtotal=o.items.reduce((n,i)=>n+i.price*i.qty,0);return `<section class="order-costs"><h3>${page==='courierDelivery'?'Detalle del pedido':'Detalle de tu pedido'}</h3>${o.items.map(i=>`<div class="order-cost-line"><span>${i.qty} × ${esc(i.name)}${itemDetailsHtml(i)}<small>${fmt(i.price)} por unidad</small></span><b>${fmt(i.qty*i.price)}</b></div>`).join('')}<div class="order-cost-line"><span>Productos</span><b>${fmt(subtotal)}</b></div><div class="order-cost-line"><span>Envío${o.delivery?`<small>${fmt(o.delivery.startingFee||0)} base + ${o.delivery.distanceKm.toFixed(3)} km × ${fmt(o.delivery.pricePerKm)}/km${o.delivery.rainFee?' + '+fmt(o.delivery.rainFee)+' por lluvia':''}</small>`:''}</span><b>${fmt(o.fee)}</b></div>${o.discount?`<div class="order-cost-line accent"><span>Descuento</span><b>−${fmt(o.discount)}</b></div>`:''}<div class="order-cost-line order-cost-total"><span>Total</span><b>${fmt(o.total)}</b></div></section>`}
function customerOrderView(o){return `<div class="delivery-scene client-order-scene"><div class="private-tracking-bg"><div class="arrival-visual">${navIcon('courier')}</div><span class="eyebrow">TU PEDIDO SE ACERCA</span><div class="arrival-time" id="arrivalTime">${o.status==='cancelled'?'Cancelado':o.status==='delivered'?'Entregado':o.etaMinutes?`${o.etaMinutes}<small>min aprox.</small>`:'<span class="arrival-wait">Calculando llegada</span>'}</div><p id="arrivalHint">${o.status==='cancelled'?'El comercio no pudo aceptar el pedido. No se procesó un pago en este piloto.':o.status==='delivered'?'¡Gracias por pedir con nosotros!':o.etaMinutes?'Tiempo estimado con la ruta por calles y la señal GPS del repartidor.':o.preparation?.pending?'Esperando que el comercio indique el tiempo de preparación.':o.courierId?'Esperando una señal de ubicación reciente del repartidor.':'Disponible cuando se asigne tu repartidor.'}</p></div><div class="delivery-client centered-person">${o.courier?participantCard(o.courier,o.id,'Tu repartidor'):`<div class="waiting-person"><span>${navIcon('courier')}</span><div><b>Tu mandadito está en marcha</b><small>Buscando un repartidor para ti</small></div></div>`}</div>${orderChatButton(o)}<section class="delivery-sheet" id="deliverySheet" style="--sheet-vh:${sheetHeightVh}" onpointermove="moveOrderSheet(event)" onpointerup="endOrderSheet(event)" onpointercancel="endOrderSheet(event,true)">${sheetHandle()}<div class="sheet-content"><div class="delivery-store" onpointerdown="beginOrderSheet(event)">${storeLogo(o.storeId,o.store)}<div><span class="eyebrow">${esc(o.id)}</span><h2>${esc(orderStatus(o))}</h2><small class="prep-countdown">${esc(preparationText(o))}</small></div></div><p class="small muted">${o.status==='picked_up'?'El tiempo se actualiza con el recorrido del repartidor. Su ubicación y ruta permanecen privadas.':o.status==='delivered'?'Tu entrega ha terminado.':o.preparation?.source==='merchant'?'El comercio indicó este tiempo aproximado de preparación.':o.preparation?.pending?'El comercio está por indicar el tiempo aproximado.':'Preparación estimada de app.'}</p><div class="order-stages">${[['placed','Preparación'],['picked_up','En camino'],['delivered','Entregado']].map(([status,label],i)=>`<span class="${(o.status==='delivered'?2:o.status==='picked_up'?1:0)>=i?'done':''}"><i>${i+1}</i>${label}</span>`).join('')}</div>${orderCosts(o)}<div class="delivery-destination"><span>Entrega en ${esc(o.address.label)}</span><b>${esc(o.address.street)}, ${esc(o.address.area)}</b></div>${o.courierId?'':'<p class="small muted">El chat se habilitará al asignar tu repartidor.</p>'}${o.status==='delivered'?`<button class="btn full" onclick="offerRating(db.orders.find(o=>o.id==='${o.id}'),false,true)">${o.myRating?'Ver o cambiar calificación':'Calificar al repartidor'}</button>`:''}<button class="link" onclick="go('help')">Necesito ayuda</button></div></section></div>`}

function favorites(){let list=stores.filter(x=>db.favorites.includes(x.id));return `<h1 class="page-title">Tus favoritos</h1><p class="sub">Todo lo que te gusta, a la mano.</p>${list.length?`<div class="merchants">${list.map(merchantCard).join('')}</div>`:empty('♡','Aún no tienes favoritos','Toca el corazón de cualquier comercio para guardarlo.','Explorar',"setCat('Todos')")}`}
function account(){let tabs=[['invitaciones','🎁','Invita a un amigo','Gana 50% de descuento en un envío'],['perfil','👤','Mi perfil','Datos personales y sesión'],['direcciones','📍','Mis direcciones','Lugares para recibir pedidos'],['notificaciones','🔔','Notificaciones','Novedades de tus pedidos'],['ajustes','⚙️','Preferencias','Avisos y privacidad'],['ayuda','❔','Centro de ayuda','Respuestas y asistencia'],['trabajo','🏪','Trabaja con nosotros','Reparte o registra tu comercio']];return `<h1 class="page-title">Mi cuenta</h1><p class="sub">${db.user?`Hola, ${esc(db.user.name.trim().split(/\s+/)[0])} 👋`:'Todo en un solo lugar.'}</p>${accountTab==='menu'?`<div class="account-list">${tabs.map(([id,icon,label,desc])=>`<button class="account-row" onclick="${`accountTab='${id}';render();${id==='trabajo'?'refreshWorkOptions()':''}`}"><span class="account-row-icon">${icon}</span><span class="account-row-text"><b>${label}${id==='notificaciones'&&db.notifications.some(n=>!n.read)?` <span class="inline-notice-count">${db.notifications.filter(n=>!n.read).length}</span>`:''}</b><small>${desc}</small></span><span class="account-chevron">›</span></button>`).join('')}</div>`:`<div class="account-detail"><button class="link" onclick="accountTab='menu';render()">← Mi cuenta</button><div class="card">${accountPanel()}</div></div>`}`}function accountPanel(){if(accountTab==='ajustes')return privacyAccountPanel();if(accountTab==='invitaciones')return referralPanel();if(accountTab==='trabajo')return workPanel();if(accountTab==='perfil'&&serverMode)return db.user?`<h2>Mi perfil</h2><label class="photo-picker account-photo" for="authPhoto"><span class="photo-preview" id="photoPreview"><img data-private-photo="/api/profile-photo" alt="Tu foto de perfil"></span><strong>CARGAR FOTO</strong><span>Toca para elegir y acomodar tu foto</span></label><input id="authPhoto" class="photo-file" type="file" accept="image/*" onchange="previewProfilePhoto(this)"><button class="btn light" onclick="uploadProfilePhoto()">Actualizar foto</button><p class="muted">Una cuenta para pedir y, si se aprueba, trabajar.</p><div class="field"><label>Nombre</label><input id="profileName" value="${esc(db.user.name)}"></div><div class="field"><label>Correo de acceso</label><input value="${esc(db.user.email)}" disabled></div><div class="field"><label>Teléfono verificado</label><input value="${esc(db.user.phone||'')}" disabled></div><button class="btn" onclick="updateProfile()">Guardar nombre</button><hr class="divider"><button class="btn light" onclick="logout()">Cerrar sesión</button>`:`<h2>Mi perfil</h2><p>Entra o regístrate con correo, contraseña y número de teléfono.</p><button class="btn" onclick="authMode='register';showModal('login')">Crear cuenta / Entrar</button>`;if(accountTab==='perfil')return db.user?`<h2>Datos personales</h2><p class="muted">Tu información se guarda solamente en este navegador durante la app.</p><div class="field"><label>Nombre</label><input id="profileName" value="${esc(db.user.name)}" maxlength="70"></div><div class="field"><label>Correo</label><input id="profileEmail" value="${esc(db.user.email)}" type="email" maxlength="120"></div><div class="field"><label>Teléfono</label><input id="profilePhone" value="${esc(db.user.phone||'')}" inputmode="tel" maxlength="20"></div><button class="btn" onclick="updateProfile()">Guardar cambios</button><hr class="divider"><button class="btn light" onclick="logout()">Cerrar sesión</button>`:`<h2>Bienvenido a Mandadito</h2><p class="muted">Crea tu cuenta para guardar direcciones y pedidos en este dispositivo.</p><button class="btn" onclick="showModal('login')">Entrar o crear cuenta</button>`;if(accountTab==='direcciones')return `<div class="row"><h2>Mis direcciones</h2><button class="btn" onclick="showModal('address')">+ Agregar</button></div>${db.addresses.length?db.addresses.map((a,i)=>`<div class="choice row"><div>📍 <b>${esc(a.label)}</b><div class="mini">${esc(a.street)}, ${esc(a.area)}, Zumpango</div><div class="mini">${Number.isFinite(a.lat)&&Number.isFinite(a.lng)?'📍 Pin de entrega guardado':'⚠️ Falta marcar el pin de entrega'}</div></div><div class="address-actions"><button class="link" onclick="showModal('address',${i})">Editar pin</button><button class="link" onclick="deleteAddress(${i})">Eliminar</button></div></div>`).join(''):'<p class="muted">Aún no tienes direcciones guardadas.</p>'}`;if(accountTab==='notificaciones')return notificationPanel();if(accountTab==='ajustes')return `<h2>Preferencias</h2><label class="choice"><input type="checkbox" ${db.settings.push?'checked':''} onchange="db.settings.push=this.checked;save()"> Avisos en esta app</label><label class="choice"><input type="checkbox" ${db.settings.email?'checked':''} onchange="db.settings.email=this.checked;save()"> Comunicaciones por correo (preferencia guardada, sin envíos)</label><hr class="divider"><h3>Privacidad</h3><p class="muted">Tus datos  permanecen en este navegador. Puedes borrarlos cuando quieras.</p>${serverMode?'<p class="small muted">La eliminación de datos del servidor requiere un proceso de soporte y revisión de privacidad.</p>':'<button class="btn light" onclick="resetData()">Borrar datos </button>'}`;return helpPanel()}

function helpPanel(){return `<h2>Centro de ayuda</h2><p>Elige un comercio, personaliza tus productos y confirma tu dirección. Puedes consultar el estado, los detalles y el chat desde Mis pedidos.</p><p>El pago se realiza en efectivo al recibir. El envío se calcula según la distancia y la tarifa vigente.</p>${supportHtml()}`}function help(){return `<h1 class="page-title">¿En qué te ayudamos?</h1><div class="card">${helpPanel()}</div>`}

async function initAddressMap(){let host=$('#addressMap');if(!host)return;let loading=$('#mapLoading');if(GOOGLE_MAPS_API_KEY){try{await loadGoogleMaps();if(!$('#addressMap'))return;let center=chosenPoint?{lat:chosenPoint.lat,lng:chosenPoint.lng}:{lat:19.7967,lng:-99.09946};mapProvider='google';addressMap=new google.maps.Map(host,{center,zoom:chosenPoint?17:14,mapTypeControl:false,streetViewControl:false,fullscreenControl:false,gestureHandling:'greedy',zoomControl:true});addressMap.addListener('click',e=>{if(e.latLng)setAddressPoint(e.latLng.lat(),e.latLng.lng(),null,'Punto de entrega colocado. Arrastra el pin si hace falta.')});if(loading)loading.remove();if(chosenPoint)setAddressPoint(chosenPoint.lat,chosenPoint.lng,chosenPoint.accuracy,'Punto de entrega guardado.');return}catch(e){console.warn('Google Maps no cargó; se usa el mapa de respaldo.',e)}}initLeafletMap()}

function locateExact(){let label=$('#locationStatus');if(!navigator.geolocation){if(label)label.textContent='Este navegador no permite acceder a la ubicación.';return}if(label)label.textContent='Solicitando permiso y buscando tu ubicación…';navigator.geolocation.getCurrentPosition(pos=>{if(modal!=='address')return;let {latitude,longitude,accuracy}=pos.coords;setAddressPoint(latitude,longitude,accuracy,'Ubicación detectada. Revisa el pin antes de guardar.');if(mapProvider==='google'){addressMap?.panTo({lat:latitude,lng:longitude});addressMap?.setZoom(17)}else if(mapProvider==='leaflet')addressMap?.setView([latitude,longitude],17)},err=>{let reason=err.code===1?'Permiso de ubicación denegado. Toca el mapa y coloca el pin manualmente.':err.code===3?'Se agotó el tiempo para ubicarte. Intenta otra vez o marca el pin.':'No fue posible obtener tu ubicación. Marca el pin en el mapa.';if(label)label.textContent=reason},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}

function beginScooter(event,el,id){if(el.disabled||event.button>0)return;event.preventDefault();sliderDragging=true;dragState={pointer:event.pointerId,start:event.clientX,value:0};el.setPointerCapture(event.pointerId)}

function endScooter(event,el,id){if(!dragState||dragState.pointer!==event.pointerId)return;let value=dragState.value;try{el.releasePointerCapture(event.pointerId)}catch{}sliderDragging=false;dragState=null;el.value=value;slideAccept(el,id)}
function keyboardScooter(event,el,id){let value=Number(el.getAttribute('aria-valuenow')||0);if(event.key==='ArrowRight')value=Math.min(100,value+20);else if(event.key==='ArrowLeft')value=Math.max(0,value-20);else if(event.key==='End')value=100;else if(['Enter',' '].includes(event.key)){event.preventDefault();el.value=value;return slideAccept(el,id)}else return;event.preventDefault();el.setAttribute('aria-valuenow',value);el.style.transform=`translateX(${(el.parentElement.clientWidth-64)*value/100}px)`}

async function loadChat(id,force=false){if(!id||!sessionToken)return;if(chatPending.has(id)){if(!force)return chatPending.get(id);await chatPending.get(id)}let task=(async()=>{try{let r=await apiReq('/orders/'+encodeURIComponent(id)+'/messages'),initial=chatMessages[id]===undefined;if(JSON.stringify(chatMessages[id])===JSON.stringify(r.messages))return;chatMessages[id]=r.messages;paintChat(id,initial);if(typeof updateConversationBadge==='function')updateConversationBadge(id)}catch{}})();chatPending.set(id,task);try{await task}finally{if(chatPending.get(id)===task)chatPending.delete(id)}}

async function refreshOrders(){if(!sessionToken||!db.user?.photoReady)return;try{let r=await apiReq('/orders');if(JSON.stringify(db.orders)===JSON.stringify(r.orders))return;let previous=db.orders;db.orders=r.orders;save();if(page==='orders'||page==='orderDetail')liveRender();noticeCompleted(r.orders,previous,false);maybeCurrentRating();syncVisibleChat()}catch{}}
class AuthenticatedEvents{constructor(url,token){this.url=url;this.token=token;this.closed=false;this.controller=new AbortController();this.run()}close(){this.closed=true;clearTimeout(this.retry);this.controller.abort()}async run(){try{let r=await fetch(this.url,{credentials:'omit',headers:{authorization:'Bearer '+this.token},signal:this.controller.signal});if(r.status===401){if(this.token===sessionToken){clearSessionState();render();toast('Tu sesión venció. Inicia sesión de nuevo.')}return}if(!r.ok)throw Error('Conexión');await this.onopen?.();let reader=r.body.getReader(),decoder=new TextDecoder(),buffer='';while(!this.closed){let {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let end;while((end=buffer.indexOf('\n\n'))>=0){let block=buffer.slice(0,end);buffer=buffer.slice(end+2);let data=block.split('\n').filter(l=>l.startsWith('data:')).map(l=>l.slice(5).trimStart()).join('\n');if(data&&!this.closed)await this.onmessage?.({data})}}}catch(e){if(this.closed)return}if(!this.closed)this.retry=setTimeout(()=>this.run(),1500)}}
function connectLive(){window.MandaditoNative?.registerPush();liveEvents?.close();liveEvents=null;if(!db.user?.verifiedPhone||!db.user?.photoReady||!serverMode)return;clearInterval(livePoll);livePoll=setInterval(()=>{if(document.visibilityState==='hidden'||!sessionToken)return;refreshOrders();if(typeof refreshReferrals==='function'&&page==='account'&&accountTab==='invitaciones')refreshReferrals();if(typeof refreshNotices==='function'){refreshNotices();refreshCatalog();if(page==='merchant')refreshMerchant()}if(workView&&roles.some(r=>r.role==='courier'&&r.active))refreshCourier();syncVisibleChat();updatePreparationCountdown()},2000);liveEvents=new AuthenticatedEvents('/api/events',sessionToken);liveEvents.onopen=()=>{refreshNotices();refreshCatalog(true);if(page==='merchant')refreshMerchant();refreshOrders();if(workView)refreshCourier();syncVisibleChat()};liveEvents.onmessage=async ev=>{let item;try{item=JSON.parse(ev.data)}catch{return}if(item.kind==='blocked'){clearSessionState();render();toast('Tu número tiene el acceso bloqueado. Contacta a soporte.');return}if(item.kind==='promotions'){await refreshReferrals(true);return}if(item.kind==='announcement'){await refreshNotices();return}if(item.kind==='work-options'){await refreshWorkOptions();return}if(item.kind==='catalog'){await refreshCatalog(true);if(page==='merchant')await refreshMerchant(true);return}if(page==='merchant')await refreshMerchant();if(['courier','courierDelivery'].includes(page)&&roles.some(r=>r.role==='courier'&&r.active)){await refreshCourier();if(item.kind==='created'&&page==='courier'&&courierData.offers.some(o=>o.id===item.orderId))toast('Nuevo pedido disponible','🛵');if(item.kind==='message'&&activeJobId===item.orderId)await loadChat(item.orderId);if(item.kind==='progress'&&page==='courierDelivery'&&activeJobId===item.orderId)toast('Estado del pedido actualizado','✓')}if(['accepted','progress','preparation','message','eta','rating'].includes(item.kind)){await refreshOrders();let order=db.orders.find(o=>o.id===item.orderId);if(item.kind==='accepted'&&order)toast('Un repartidor tomó tu pedido','🛵');if(item.kind==='progress'&&order?.status==='picked_up')toast('Tu repartidor recogió el pedido y va a tu domicilio','✓');if(item.kind==='progress'&&order?.status==='delivered')toast('Tu pedido fue entregado','✓');if(item.kind==='message'&&page==='orderDetail'&&currentOrder===item.orderId)await loadChat(item.orderId)}}}
let gpsBlocked=false,gpsWarned=false;function startGps(){if(gpsBlocked)return;if(!courierData.jobs.some(o=>['assigned','picked_up'].includes(o.status))){if(gpsWatch!==null){navigator.geolocation?.clearWatch(gpsWatch);gpsWatch=null}return}if(!navigator.geolocation||gpsWatch!==null)return;gpsWatch=navigator.geolocation.watchPosition(async pos=>{courierPosition={lat:pos.coords.latitude,lng:pos.coords.longitude};updateCourierMap();if(Date.now()-lastGps<15000)return;lastGps=Date.now();try{await apiReq('/courier/location','POST',{lat:pos.coords.latitude,lng:pos.coords.longitude})}catch{}},error=>{if(error.code===1){if(gpsWatch!==null)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;gpsBlocked=true}if(!gpsWarned){gpsWarned=true;toast(error.code===1?'Permite tu ubicación para mostrar el avance y calcular la llegada.':'Esperando señal GPS del teléfono.','📍')}},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
function beginOrderSheet(event){if(event.button>0||event.target.closest('a,input,textarea,form'))return;let sheet=document.querySelector('#deliverySheet');if(!sheet)return;event.preventDefault();sheetGesture={pointer:event.pointerId,startY:event.clientY,startHeight:sheetHeightVh,lastY:event.clientY,lastAt:performance.now(),velocity:0};sheet.classList.add('dragging');sheet.setPointerCapture(event.pointerId)}
function moveOrderSheet(event){if(!sheetGesture||sheetGesture.pointer!==event.pointerId)return;let now=performance.now();sheetGesture.velocity=(sheetGesture.lastY-event.clientY)/Math.max(1,now-sheetGesture.lastAt);sheetGesture.lastY=event.clientY;sheetGesture.lastAt=now;sheetHeightVh=Math.min(84,Math.max(28,sheetGesture.startHeight+(sheetGesture.startY-event.clientY)/window.innerHeight*100));applySheetHeight()}
function applySheetHeight(){document.body?.classList?.toggle('sheet-tall',sheetHeightVh>66);document.querySelector('#deliverySheet')?.style.setProperty('--sheet-vh',sheetHeightVh);document.querySelector('.sheet-handle')?.setAttribute('aria-valuenow',Math.round(sheetHeightVh));document.querySelectorAll('.order-notice').forEach(el=>el.style.setProperty('--sheet-vh',sheetHeightVh))}
function endOrderSheet(event,cancel=false){if(!sheetGesture||sheetGesture.pointer!==event.pointerId)return;let direction=sheetGesture.velocity;sheetGesture=null;let sheet=document.querySelector('#deliverySheet');try{sheet?.releasePointerCapture(event.pointerId)}catch{}sheet?.classList.remove('dragging');let stops=[28,48,84];if(!cancel&&Math.abs(direction)>.4){let options=stops.filter(n=>direction>0?n>sheetHeightVh:n<sheetHeightVh);sheetHeightVh=options.length?(direction>0?options[0]:options.at(-1)):direction>0?84:28}else sheetHeightVh=stops.reduce((a,b)=>Math.abs(a-sheetHeightVh)<Math.abs(b-sheetHeightVh)?a:b);applySheetHeight();if(deferredOrderRender){deferredOrderRender=false;liveRender()}}
function keyboardOrderSheet(event){if(!['ArrowUp','ArrowDown','Home','End'].includes(event.key))return;event.preventDefault();sheetHeightVh=event.key==='End'?84:event.key==='Home'?28:Math.min(84,Math.max(28,sheetHeightVh+(event.key==='ArrowUp'?10:-10)));applySheetHeight()}

function deliveryView(){let o=courierData.jobs.find(x=>x.id===activeJobId);if(!o)return `<div class="delivery-missing"><p>Esta entrega ya no está activa.</p><button class="btn" onclick="go('courier')">Volver a Pedidos</button></div>`;let store=stores.find(x=>x.id===o.storeId||x.name===o.store),phone=o.customer?.phone?.replace(/[^+\d]/g,''),shopPhone=o.merchantPhone?.replace(/[^+\d]/g,'');return `<div class="delivery-scene"><div id="deliveryMap" class="delivery-map" aria-label="Mapa de referencia con el punto de entrega"></div><div class="delivery-map-caption" id="routeDistance">📍 ${o.delivery?.origin?.demo?'Comercio ':'Ruta de entrega'} · ${o.delivery?o.delivery.distanceKm.toFixed(2)+' km':''}</div><button class="map-center-control" onclick="centerCourierMap()" aria-label="Centrar en mi ubicación" title="Seguir mi ubicación">◎</button><div class="delivery-client centered-person">${participantCard(o.customer,o.id,'Cliente')}<a ${phone?`href="tel:${esc(phone)}"`:'aria-disabled="true"'} class="delivery-call ${phone?'':'disabled'}" aria-label="${phone?'Llamar al cliente':'Teléfono del cliente no disponible'}">☎</a></div>${courierWhatsAppButton(o)}${orderChatButton(o)}<section class="delivery-sheet" id="deliverySheet" style="--sheet-vh:${sheetHeightVh}" onpointermove="moveOrderSheet(event)" onpointerup="endOrderSheet(event)" onpointercancel="endOrderSheet(event,true)">${sheetHandle()}<div class="sheet-content"><div class="delivery-store" onpointerdown="beginOrderSheet(event)">${storeLogo(o.storeId,o.store)}<div><span class="eyebrow">${o.status==='picked_up'?'RUMBO AL DOMICILIO':'DIRÍGETE AL COMERCIO'}</span><h2>${esc(o.store)}</h2><small>${esc(o.id)} · ${o.status==='picked_up'?'Pedido recogido':'Pedido por recoger'}</small></div></div><div class="delivery-actions"><button class="btn light" onclick="openNavigationPicker()">↗ ${o.status==='picked_up'?'Navegar al domicilio':'Ir al establecimiento'}</button>${shopPhone?`<a class="btn light" href="tel:${esc(shopPhone)}">☎ Llamar al comercio</a>`:`<button class="btn light" disabled title="No hay teléfono del comercio verificado">☎ Comercio sin teléfono</button>`}${o.status==='assigned'?`<button class="btn delivery-pickup" onclick="courierAction('progress','${o.id}')">✓ Ya recogí el pedido</button>`:''}</div><p class="courier-preparation-time">${esc(preparationText(o))}</p><p class="small muted">${o.delivery?.origin?.demo?'Pin de comercio . Configura el pin real desde Administración.':'Punto de recogida confirmado.'}</p><div class="delivery-destination"><span>📍 Entregar a ${esc(o.customer?.name||'cliente')}</span><b>${esc(o.address.street)}, ${esc(o.address.area)}</b><small>${esc(o.address.label)} · Zumpango</small></div><div class="delivery-totals"><div><span>Total del pedido</span><b>${fmt(o.total)}</b></div><div><span>Tu ganancia estimada</span><b class="accent">${fmt(o.payout)}</b></div></div>${o.status==='picked_up'?`<button class="btn full delivery-progress" onclick="courierAction('progress','${o.id}')">✓ Entregar pedido</button>`:''}${orderCosts(o)}</div></section></div>`}
let courierMarker=null,routeLine=null,routeBackLine=null,mapConfigCache=null,mapConfigAt=0,mapInitSequence=0;
function mapSymbol(kind){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${kind==='home'?'<path d="m3 10 9-7 9 7v10h-6v-6H9v6H3z"/>':'<path d="M4 10v11h16V10M3 10l2-7h14l2 7M3 10c0 3 4 3 4 0 0 3 5 3 5 0 0 3 5 3 5 0 0 3 4 3 4 0M8 21v-7h5v7M16 14h1"/>'}</svg>`}
function currentMapOrder(){return page==='courierDelivery'?courierData.jobs.find(o=>o.id===activeJobId):null}
async function getMapConfig(){if(mapConfigCache&&Date.now()-mapConfigAt<60000)return mapConfigCache;mapConfigCache=await apiReq('/maps-config');mapConfigAt=Date.now();return mapConfigCache}
async function initDeliveryMap(){let order=currentMapOrder(),holder=$('#deliveryMap');if(!order||!holder||deliveryMap)return;let sequence=++mapInitSequence;try{let config=await getMapConfig();if(sequence!==mapInitSequence||!holder.isConnected||currentMapOrder()?.id!==order.id)return;if(!config.enabled||!config.publicToken)return initLeafletDeliveryMap();let sdk=await MandaditoMapbox.loadSDK();if(sequence!==mapInitSequence||!holder.isConnected||currentMapOrder()?.id!==order.id)return;if(sdk.supported&&!sdk.supported())return initLeafletDeliveryMap();let map=MandaditoMapbox.create(sdk,holder,config,order,page==='orderDetail',mapSymbol,failed=>{setTimeout(()=>{if(deliveryMap===failed&&holder.isConnected){failed.remove();deliveryMap=null;holder.innerHTML='';initLeafletDeliveryMap()}},0)});map._orderKey=page+':'+order.id;deliveryMap=map;if(page==='courierDelivery')updateCourierMap()}catch{if(sequence===mapInitSequence&&holder.isConnected){holder.innerHTML='';initLeafletDeliveryMap()}}}
function initLeafletDeliveryMap(){if(page!=='courierDelivery')return;let customerView=page==='orderDetail',holder=$('#deliveryMap'),o=customerView?db.orders.find(x=>x.id===currentOrder):courierData.jobs.find(x=>x.id===activeJobId);if(!holder||!o)return;let destination=[Number(o.address.lat),Number(o.address.lng)],origin=o.delivery?.origin;if(typeof L==='undefined'){holder.innerHTML='<div class="map-unavailable">El mapa necesita conexión a internet.</div>';return}try{deliveryMap=L.map(holder,{zoomControl:false,scrollWheelZoom:false}).setView(destination,14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(deliveryMap);let pin=(kind,color)=>L.divIcon({className:'delivery-pin '+(((o.status==='picked_up'||o.status==='delivered')?kind==='home':kind==='store')?'destination-pin':''),html:`<span style="background:${color}">${mapSymbol(kind)}</span>`,iconSize:[38,38],iconAnchor:[19,38]});L.marker(destination,{icon:pin('home','#211c19')}).addTo(deliveryMap).bindPopup('Domicilio de entrega');if(origin)L.marker([origin.lat,origin.lng],{icon:pin('store','#f45113')}).addTo(deliveryMap).bindPopup(origin.demo?'Comercio ':o.store);let coords=(o.delivery?.geometry||[]).map(p=>[p[1],p[0]]);if(coords.length){routeBackLine=L.polyline(coords,{color:'#fff',weight:8,opacity:.9}).addTo(deliveryMap);routeLine=L.polyline(coords,{color:'#f45113',weight:5,opacity:.95}).addTo(deliveryMap);deliveryMap.fitBounds(routeLine.getBounds(),{paddingTopLeft:[50,150],paddingBottomRight:[50,260],maxZoom:16})}else if(origin)deliveryMap.fitBounds([[origin.lat,origin.lng],destination],{padding:[70,180],maxZoom:15});courierMarker=null;if(!customerView)updateCourierMap();setTimeout(()=>deliveryMap?.invalidateSize(),180)}catch{holder.innerHTML='<div class="map-unavailable">Punto de entrega guardado. Usa el botón de navegación.</div>'}}
function centerCourierMap(){if(!courierPosition){gpsBlocked=false;gpsWarned=false;startGps();toast('Activa la ubicación del teléfono para seguir tu recorrido.','📍');return}if(deliveryMap?.engine==='mapbox')deliveryMap.setFollow(true);else deliveryMap?.panTo([courierPosition.lat,courierPosition.lng],{animate:true})}
async function updateCourierMap(){if(!deliveryMap||!courierPosition||page!=='courierDelivery')return;let point=[courierPosition.lat,courierPosition.lng];if(deliveryMap.engine==='mapbox')deliveryMap.setCourier(courierPosition);else if(courierMarker)courierMarker.setLatLng(point);else courierMarker=L.marker(point,{icon:L.divIcon({className:'courier-gps',html:'<span>🛵</span>',iconSize:[38,38]})}).addTo(deliveryMap).bindPopup('Tu ubicación');if(routeBusy||Date.now()-routeAt<30000)return;routeBusy=true;routeAt=Date.now();let job=activeJobId;try{let r=await apiReq('/courier/route','POST',{orderId:job,...courierPosition});if(job!==activeJobId||!deliveryMap)return;courierRoute=r;if(deliveryMap.engine==='mapbox')deliveryMap.setRoute(r.geometry);else{let coords=r.geometry.map(p=>[p[1],p[0]]);routeLine?.setLatLngs(coords);routeBackLine?.setLatLngs(coords)}let badge=$('#routeDistance');if(badge)badge.textContent=`${r.distanceKm.toFixed(2)} km · ${r.durationMinutes} min`}catch{}finally{routeBusy=false}}

function openNavigationPicker(){let o=courierData.jobs.find(x=>x.id===activeJobId);if(!o)return;let home=o.status==='picked_up',origin=o.delivery?.origin,query=encodeURIComponent(o.store+' Zumpango Estado de México'),coords=`${o.address.lat},${o.address.lng}`;let links=home?{google:`https://www.google.com/maps/dir/?api=1&destination=${coords}`,waze:`https://waze.com/ul?ll=${coords}&navigate=yes`,apple:`https://maps.apple.com/?daddr=${coords}`}:{google:origin?`https://www.google.com/maps/dir/?api=1&destination=${origin.lat},${origin.lng}`:`https://www.google.com/maps/search/?api=1&query=${query}`,waze:origin?`https://waze.com/ul?ll=${origin.lat},${origin.lng}&navigate=yes`:`https://waze.com/ul?q=${query}&navigate=yes`,apple:origin?`https://maps.apple.com/?daddr=${origin.lat},${origin.lng}`:`https://maps.apple.com/?q=${query}`};let el=document.createElement('div');el.className='map-choice-backdrop';el.onclick=e=>{if(e.target===el)el.remove()};el.innerHTML=`<section class="map-choice" role="dialog" aria-label="Elegir navegador"><button class="map-choice-close" onclick="this.closest('.map-choice-backdrop').remove()" aria-label="Cerrar">✕</button><h2>¿Con qué mapa quieres ir?</h2><p>${home?'Abrir el punto de entrega confirmado.':'Abrir el pin de recogida del comercio.'}</p><a href="${links.google}" target="_blank" rel="noopener noreferrer" onclick="this.closest('.map-choice-backdrop').remove()"><img src="https://www.google.com/s2/favicons?domain=maps.google.com&sz=128" alt="Logo de Google Maps">Google Maps <span>↗</span></a><a href="${links.waze}" target="_blank" rel="noopener noreferrer" onclick="this.closest('.map-choice-backdrop').remove()"><img src="https://www.google.com/s2/favicons?domain=waze.com&sz=128" alt="Logo de Waze">Waze <span>↗</span></a><a href="${links.apple}" target="_blank" rel="noopener noreferrer" onclick="this.closest('.map-choice-backdrop').remove()"><img src="https://www.google.com/s2/favicons?domain=maps.apple.com&sz=128" alt="Logo de Apple Maps">Apple Maps <span>↗</span></a><small>Se abrirá el navegador o la app de mapas disponible en tu teléfono.</small></section>`;document.body.append(el)}
function gateScreen(){let logged=!!db.user,phase=!logged?'welcome':!db.user.verifiedPhone?'verify':!db.user.photoReady?'photo':'ready';if(phase==='ready')return false;clearInterval(offerTimer);if(phase==='verify')authMode='verify';if(phase==='photo')authMode='photo';let welcome=phase==='welcome';$('#root').innerHTML=`<div class="entry-page"><div class="entry-art"><img class="entry-brand-lockup" src="assets/logo-lockup.png" alt="mandadito" width="2048" height="683"><div class="entry-orb" aria-hidden="true"></div><h1>Lo bueno llega a ti.</h1><p>Tu ciudad, tus antojos y tus mandaditos, en un solo lugar.</p><span class="entry-city">📍 Zumpango, Estado de México</span></div><div class="entry-panel"><div class="entry-mobile-brand"><img class="brand-lockup" src="assets/logo-lockup.png" alt="mandadito" width="2048" height="683"></div><span class="eyebrow">BIENVENIDO A MANDADITO</span><h2>${welcome?'Registrarte o entrar':phase==='verify'?'Confirma tu teléfono':'Tu foto de perfil'}</h2><p class="muted">${welcome?'Empieza con tu número de teléfono. Compra y solicita trabajar desde la misma cuenta.':phase==='verify'?'Un paso más para activar tu cuenta.':'Agrega una foto para terminar el registro.'}</p>${welcome?`<button class="btn full" onclick="authMode='phone';showModal('login')">Registrarte</button><button class="btn light full" onclick="authMode='login';showModal('login')">Entrar</button>`:authModalHtml()}${!welcome?`<button class="entry-exit" onclick="logout()">Cerrar sesión</button>`:''}<p class="entry-note">Tu ciudad, a un mandadito de distancia.</p></div></div>`;return true}
function render(){if(typeof syncOrderConversation==='function')syncOrderConversation();document.body?.classList?.toggle('merchant-onboarding',typeof isMerchantRegistration==='function'&&isMerchantRegistration());document.body?.classList?.toggle('sheet-tall',['courierDelivery','orderDetail'].includes(page)&&sheetHeightVh>66);queueMicrotask(hydratePrivatePhotos);mapInitSequence++;let order=currentMapOrder(),reuse=deliveryMap?.engine==='mapbox'&&deliveryMap._orderKey===page+':'+order?.id,mapNode=reuse?document.querySelector('#deliveryMap'):null;if(mapNode)mapNode.remove();if(deliveryMap&&!reuse){deliveryMap.remove();deliveryMap=null}if(serverMode&&gateScreen()){if(modal&&db.user){modal='';document.querySelector('#overlay')?.remove()}else if(modal)renderModal();return}if(page==='checkout')queueMicrotask(()=>requestDeliveryQuote());if(page==='home')offerIndex=0;let content={home,browse,store:storeView,cart,checkout:checkoutView,send:sendView,orders,orderDetail,favorites,account,help,courier:courierPanel,courierDelivery:deliveryView,merchant:merchantPanel,rating:ratingView}[page]||home;$('#root').innerHTML=header()+`<main class="wrap">${content()}</main><footer class="footer ${['courierDelivery','orderDetail','rating'].includes(page)||(typeof isMerchantRegistration==='function'&&isMerchantRegistration())?'hidden-footer':''}"><div class="wrap"><span>© Mandadito · Hecho para Zumpango</span><span>Compras y entregas locales</span><button class="link" onclick="go('help')">Ayuda</button></div></footer>`+bottom();if(page==='home')resumeOffers();else clearInterval(offerTimer);if(reuse&&mapNode){document.querySelector('#deliveryMap')?.replaceWith(mapNode);let changed=deliveryMap.setOrder(order);deliveryMap.resize();if(changed&&page==='courierDelivery'){routeAt=0;courierRoute=null;updateCourierMap()}}else if(page==='courierDelivery')setTimeout(initDeliveryMap,50);if(page==='merchant'&&typeof merchantTab!=='undefined'&&(merchantTab==='business'||isMerchantRegistration()))setTimeout(initBusinessMap,0);if(modal)renderModal()}
let splashStarted=performance.now(),splashDone=false;function launchTone(){try{let Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;let ctx=new Audio(),osc=ctx.createOscillator(),gain=ctx.createGain(),now=ctx.currentTime;osc.type='sine';osc.frequency.setValueAtTime(520,now);osc.frequency.exponentialRampToValueAtTime(780,now+.16);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.035,now+.04);gain.gain.exponentialRampToValueAtTime(.0001,now+.32);osc.connect(gain).connect(ctx.destination);osc.start(now);osc.stop(now+.34);osc.onended=()=>ctx.close()}catch{}}function hideSplash(){if(splashDone)return;splashDone=true;setTimeout(()=>{let el=$('#launchSplash');if(el){el.classList.add('leaving');setTimeout(()=>el.remove(),520)}},Math.max(0,1250-(performance.now()-splashStarted)))}render();if(serverMode&&sessionToken)syncServer(true).finally(hideSplash);else hideSplash();setTimeout(hideSplash,4500);let toneOnce=()=>{launchTone();window.removeEventListener('pointerdown',toneOnce)};window.addEventListener('pointerdown',toneOnce,{once:true});
window.addEventListener('pagehide',()=>{rememberView();liveEvents?.close();clearInterval(livePoll)});window.addEventListener('pageshow',e=>{if(e.persisted&&sessionToken){shopOrder=shuffleStores(stores.map(s=>s.id));syncServer()}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&sessionToken){refreshOrders();if(workView)refreshCourier();syncVisibleChat();if(!liveEvents||liveEvents.closed)connectLive()}});
</script></body></html>
